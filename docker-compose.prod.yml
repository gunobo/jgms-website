services:
  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jgms_club}
      MYSQL_USER: ${MYSQL_USER:-jgms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-jgms}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-jgms_club}
      FRONTEND_ORIGIN: ${PUBLIC_URL:-http://localhost:5106}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
    restart: always
    ports:
      - "5106:80"
    depends_on:
      - backend

  # Optional: only starts if CLOUDFLARE_TUNNEL_TOKEN is set in .env. Points the
  # tunnel's public hostname (configured in the Cloudflare Zero Trust dashboard)
  # at http://web:80 over the internal docker network.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env, or remove this service if not using a tunnel}
    depends_on:
      - web

volumes:
  mysql_data:
  backend_uploads:
