services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 200m
    command:
      - --innodb-buffer-pool-size=32M
      - --innodb-log-buffer-size=4M
      - --max-connections=20
      - --performance-schema=OFF
      - --table-open-cache=64
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jgms_club}
      MYSQL_USER: ${MYSQL_USER:-jgms}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jgms_dev_pw}
    ports:
      - "33066:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_pw}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 300m
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-jgms}:${MYSQL_PASSWORD:-jgms_dev_pw}@mysql:3306/${MYSQL_DATABASE:-jgms_club}
      # Local dev default; override in the root .env when deploying (e.g. https://jgms.imjemin.co.kr)
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5174}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      mysql:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]

  frontend:
    build:
      context: ./frontend
      # These are compiled into the built JS, so they must be passed at build
      # time (not read from frontend/.env, which isn't copied into the image).
      # Changing either in .env requires `docker compose up -d --build
      # frontend`, not just a restart.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    mem_limit: 150m
    ports:
      - "5174:5173"
    depends_on:
      - backend

  # Only starts with `docker compose --profile tunnel up -d` (see README "서버 배포").
  # Not needed for local development.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  backend_venv:
